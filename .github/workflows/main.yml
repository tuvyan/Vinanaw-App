name: Build Vinanaw app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack the signing key (from repository secrets)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vinanaw.p12"
            echo "VINANAW_KEYSTORE_FILE=$RUNNER_TEMP/vinanaw.p12" >> "$GITHUB_ENV"
            echo "VINANAW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key in the repository secrets, so this is a test (debug) build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the signed app (APK for phones, AAB for the Play Store)
        if: steps.key.outputs.signed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Vinanaw.apk
          cp app/build/outputs/bundle/release/app-release.aab out/Vinanaw-PlayStore.aab

      - name: Build a test app
        if: steps.key.outputs.signed != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Vinanaw-test.apk

      - name: Save the app files
        uses: actions/upload-artifact@v4
        with:
          name: Vinanaw-app
          path: out/*

      - name: Publish a release page with the APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/Vinanaw.apk
          body: |
            Vinanaw — Dictionary & Lessons (free, works offline).
            © Banao Bodong Tribal Association.

            To install on an Android phone or tablet: download Vinanaw.apk below, open it,
            and allow installing from this source when the phone asks.
